services:
  - type: web
    name: communitysync-backend
    env: python
    pythonVersion: 3.10
    region: us-east-1
    buildCommand: "pip install --prefer-binary -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        scope: build,runtime
      - key: GROQ_API_KEY
        scope: build,runtime
      - key: OPENCAGE_API_KEY
        scope: build,runtime
      - key: GEMINI_API_KEY
        scope: build,runtime
      - key: JWT_SECRET
        scope: build,runtime
      - key: CORS_ORIGINS
        value: '["https://communitysync-frontend.onrender.com"]'
      - key: DEBUG
        value: "False"
